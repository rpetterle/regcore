
name: Build CRAN source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Show R version
        run: R --version

      - name: Build package
        run: |
          R CMD build .
          test -f regcore_0.1.0.tar.gz

      - name: Upload source package
        uses: actions/upload-artifact@v6
        with:
          name: regcore-cran-source
          path: regcore_0.1.0.tar.gz
          if-no-files-found: error

  check-devel:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          use-public-rspm: true
      
      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat

      - name: Verify testthat installation
        run: |
          stopifnot(requireNamespace("testthat", quietly = TRUE))
          packageVersion("testthat")
        shell: Rscript {0}

      - uses: actions/download-artifact@v7
        with:
          name: regcore-cran-source

      - name: Check source package with R-devel
        run: |
          R CMD check --as-cran --no-manual regcore_0.1.0.tar.gz
